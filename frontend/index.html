<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#edf4ff" />
    <script>
      // Restore before rendering so refreshes and full-page navigation do not flash light mode.
      (() => {
        let theme = 'light';
        try { if (localStorage.getItem('kinderprint-theme') === 'dark') theme = 'dark'; } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#091525' : '#edf4ff';
      })();
    </script>
    <style>html[data-theme="dark"], html[data-theme="dark"] body { background: #091525; }</style>
    <meta name="description" content="Vkinder neighbourhood evidence explorer" />
    <script>
      // Home only: fetch the first frame of the tour video early so it is on screen while the video loads.
      if (location.pathname === '/' || location.pathname === '/user-journey') {
        const l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '/user-journey/journey_poster.jpg'; l.setAttribute('fetchpriority', 'high'); document.head.appendChild(l)
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Manrope:wght@400;500;600;650;700;800&display=swap" />
    <title>Vkinder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
